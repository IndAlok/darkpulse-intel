name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Pytest with coverage floor
        run: |
          python -m pytest tests/ -q --cov=src/darkpulse --cov-report=term --cov-fail-under=75
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Mypy
        run: python -m mypy src

  compose:
    runs-on: ubuntu-latest
    env:
      # Placeholders only. Compose interpolates the whole file, including
      # observability services, before applying --profile core.
      REDIS_PASSWORD: ci-redis-password
      MONGO_ROOT_PASSWORD: ci-mongo-password
      NEO4J_PASSWORD: ci-neo4j-password
      GRAFANA_PASSWORD: ci-grafana-password
      DARKPULSE_AUTH_TOKENS_JSON: '{"ci_analyst_token_at_least_32_chars":{"subject":"analyst-001","role":"analyst"}}'
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose --profile core config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
