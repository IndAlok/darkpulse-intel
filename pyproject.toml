[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darkpulse"
version = "1.0.0"
description = "DarkPulse - localized dark web intelligence monitor for narcotics OSINT"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.1",
    "fasttext-wheel>=0.9.2",
    "httpx[socks]==0.28.1",
    "joblib>=1.3.0",
    "jsonschema[format]==4.26.0",
    "langdetect>=1.0.9",
    "motor>=3.3.0",
    "neo4j>=5.17.0",
    "numpy>=1.24.0,<2.0",
    "prometheus-client==0.22.1",
    "pyasn1>=0.5.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0.0",
    "reportlab>=4.0.0",
    "redis==6.4.0",
    "requests>=2.31.0",
    "spacy>=3.7.0",
    "structlog>=24.1.0",
    "telethon==1.44.0",
    "uvicorn[standard]==0.51.0",
    "yara-python>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.8.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.21",
    "scikit-learn>=1.4.0",
]

[project.scripts]
darkpulse = "darkpulse.api.app:main"
darkpulse-cli = "darkpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "ICN", "PIE", "T20", "RSE", "RET", "SIM", "ERA", "LOG"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/darkpulse/api/**" = ["B008"]
"src/darkpulse/cli.py" = ["T201"]
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
