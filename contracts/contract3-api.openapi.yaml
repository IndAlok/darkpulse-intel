          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Date To
      - name: vendor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Vendor
      - name: intel_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Intel Id
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Q
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
